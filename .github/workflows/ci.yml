name: Capability Wall CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify CTF
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Defense in depth: CI must never call OpenRouter or bake keys into the bundle.
      VITE_OPENROUTER_KEY: ""
      NO_COLOR: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Version comes from the "packageManager" field in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@41ff7361698581a11a148a83b5b4d7371b643884 # v4.2.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build
