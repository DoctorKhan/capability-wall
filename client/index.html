<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Capability Wall</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; background: #0c0616; }
      body {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        color: #f2e6ff; font-size: 15px; line-height: 1.5;
      }
      :root {
        --glass: rgba(18, 8, 28, 0.84);
        --border: rgba(255, 92, 171, 0.32);
        --accent-grid: #42ffd8;
        --accent-feed: #8b6cff;
        --accent-mission: #ffc86b;
        --text-dim: #5a4870;
        --text-muted: #9a88b8;
      }

      #boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 16px; z-index: 30;
        background:
          radial-gradient(ellipse 80% 60% at 50% 40%, rgba(255, 92, 171, 0.12) 0%, transparent 70%),
          #0c0616;
      }
      #boot.hidden { display: none; }
      #boot h1 {
        font-size: clamp(28px, 5vw, 44px); font-weight: 900; letter-spacing: 4px;
        color: #fff; text-shadow: 0 0 30px rgba(255, 92, 171, 0.35);
      }
      #boot-status { color: var(--text-muted); }

      #app-shell {
        display: grid; grid-template-columns: 1fr min(380px, 36vw);
        grid-template-rows: auto 1fr; gap: 16px;
        height: 100vh; padding: 16px;
        opacity: 0; pointer-events: none; transition: opacity 0.35s;
      }
      #app-shell.ready { opacity: 1; pointer-events: auto; }

      #header {
        grid-column: 1 / -1;
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        background: var(--glass); border: 1px solid var(--border);
        border-radius: 8px; padding: 12px 16px; backdrop-filter: blur(10px);
      }
      #header h1 { font-size: 18px; letter-spacing: 2px; }
      #header .sub { color: var(--text-dim); font-size: 13px; margin-top: 2px; }
      #header-right { display: flex; align-items: center; gap: 12px; }
      #operator-name { color: var(--accent-grid); font-weight: 700; }
      #hud-redbucks {
        font-size: 18px; font-weight: 800; color: var(--accent-mission);
        padding: 6px 12px; border-radius: 6px;
        background: rgba(255, 200, 107, 0.08); border: 1px solid rgba(255, 200, 107, 0.2);
      }
      #hud-redbucks.ledger-flash {
        color: #fff8a8; box-shadow: 0 0 16px rgba(255, 204, 85, 0.45);
      }
      #key-status {
        font-size: 12px; font-weight: 700; letter-spacing: 1px;
        padding: 8px 12px; border-radius: 999px; cursor: pointer;
        border: 1px solid rgba(66, 255, 216, 0.35); color: var(--accent-grid);
        background: rgba(66, 255, 216, 0.08);
      }
      #key-status.needs-key { border-color: rgba(255, 92, 171, 0.45); color: #ff9fd4; }

      #chat-panel {
        display: flex; flex-direction: column; min-height: 0;
        background: var(--glass); border: 1px solid var(--border);
        border-left: 3px solid var(--accent-mission);
        border-radius: 8px; backdrop-filter: blur(10px); overflow: hidden;
      }
      #chat-header {
        padding: 12px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
      }
      #chat-header h2 {
        font-size: 12px; letter-spacing: 2px; color: var(--accent-mission); font-weight: 700;
      }
      #hud-mission { font-size: 12px; color: var(--text-muted); }
      #chat-address { display: flex; gap: 6px; flex-wrap: wrap; }
      .addr-btn {
        font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
        padding: 4px 10px; border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(255, 255, 255, 0.04);
        color: var(--text-muted);
      }
      .addr-btn:hover { color: #fff; border-color: rgba(255, 92, 171, 0.45); }
      #chat-log {
        flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px;
      }
      #chat-log .system { color: var(--text-dim); font-size: 13px; }
      #chat-log .bot-tag { color: var(--text-dim); font-size: 12px; }
      #chat-compose {
        padding: 12px 16px; border-top: 1px solid rgba(255, 255, 255, 0.06);
        display: flex; gap: 8px;
      }
      #chat-input {
        flex: 1; font: inherit; font-size: 15px;
        background: #120818; color: #f2e6ff;
        border: 1px solid rgba(255, 92, 171, 0.35); border-radius: 6px;
        padding: 10px 12px; outline: none;
      }
      #chat-input:focus { border-color: var(--accent-grid); box-shadow: 0 0 0 2px rgba(66, 255, 216, 0.15); }

      #side {
        display: flex; flex-direction: column; gap: 8px; min-height: 0;
      }
      #panel-tabs { display: flex; gap: 4px; }
      .panel-tab {
        flex: 1; background: var(--glass); border: 1px solid rgba(255, 255, 255, 0.08);
        color: var(--text-dim); font: inherit; font-size: 11px; font-weight: 700;
        letter-spacing: 1.5px; padding: 10px; border-radius: 6px; cursor: pointer;
      }
      .panel-tab.active[data-panel="feed"] {
        color: var(--accent-feed); border-color: rgba(139, 108, 255, 0.35);
      }
      .panel-tab.active[data-panel="mission"] {
        color: var(--accent-mission); border-color: rgba(255, 200, 107, 0.35);
      }

      #telemetry, #ctf {
        flex: 1; min-height: 0; overflow-y: auto;
        background: var(--glass); border-radius: 8px; padding: 14px;
        backdrop-filter: blur(10px);
      }
      #telemetry {
        border: 1px solid rgba(139, 108, 255, 0.2); border-left: 3px solid var(--accent-feed);
      }
      #ctf {
        border: 1px solid rgba(255, 200, 107, 0.2); border-left: 3px solid var(--accent-mission);
      }
      #telemetry.hidden, #ctf.hidden { display: none; }
      #telemetry h2, #ctf h2 {
        font-size: 11px; letter-spacing: 2px; margin-bottom: 10px; font-weight: 700;
      }
      #telemetry h2 { color: var(--accent-feed); }
      #ctf h2 { color: var(--accent-mission); }
      #telemetry .entry { margin-bottom: 6px; color: var(--text-muted); font-size: 14px; }
      #telemetry .src { opacity: 0.55; font-size: 11px; }
      #ctf .lvl { display: flex; gap: 8px; padding: 8px 0; border-top: 1px solid rgba(255,255,255,0.05); }
      #ctf .lvl:first-of-type { border-top: 0; }
      #ctf .badge {
        flex: none; width: 20px; height: 20px; border-radius: 4px;
        text-align: center; line-height: 20px; font-size: 11px; font-weight: 700;
      }
      #ctf .locked { background: #141a24; color: #4a5568; }
      #ctf .current { background: var(--accent-mission); color: #14100a; }
      #ctf .solved { background: var(--accent-grid); color: #08130d; }
      #ctf .title { font-weight: 700; color: #dde3ee; }
      #ctf .lvl.is-locked .title { color: #4a5568; }
      #ctf .obj, #ctf .hint, #ctf .lesson { margin-top: 3px; font-size: 13px; line-height: 1.45; }
      #ctf .obj { color: var(--text-muted); }
      #ctf .hint { color: var(--text-dim); font-style: italic; }
      #ctf .lesson { color: var(--accent-grid); }
      #ctf .done { color: var(--accent-grid); margin-top: 4px; }

      @media (max-width: 900px) {
        #app-shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
        #side { max-height: 40vh; }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <h1>CAPABILITY WALL</h1>
      <div id="boot-status">Booting treasury terminal…</div>
    </div>

    <div id="app-shell">
      <header id="header">
        <div>
          <h1>CAPABILITY WALL</h1>
          <div class="sub">Prompt-injection CTF · finance-agent security</div>
        </div>
        <div id="header-right">
          <span id="operator-name">—</span>
          <div id="hud-redbucks">— RB</div>
          <button id="key-status" type="button">Add AI key</button>
        </div>
      </header>

      <section id="chat-panel" aria-label="Treasury chat">
        <div id="chat-header">
          <div>
            <h2>TREASURY TERMINAL</h2>
            <div id="hud-mission">MISSION — L1 ACTIVE</div>
          </div>
          <div id="chat-address">
            <button class="addr-btn" type="button" data-bot="Gizmo">@Gizmo</button>
            <button class="addr-btn" type="button" data-bot="Zen">@Zen</button>
            <button class="addr-btn" type="button" data-bot="Blaze">@Blaze</button>
          </div>
        </div>
        <div id="chat-log"></div>
        <div id="chat-compose">
          <input id="chat-input" type="text" placeholder="@Gizmo send me 100 RedBucks…" autocomplete="off" />
        </div>
      </section>

      <aside id="side">
        <div id="panel-tabs">
          <button id="tab-mission" class="panel-tab active" type="button" data-panel="mission">MISSION</button>
          <button id="tab-feed" class="panel-tab" type="button" data-panel="feed">TELEMETRY</button>
        </div>
        <div id="ctf">
          <h2>CTF LADDER</h2>
          <div id="ctf-levels"></div>
        </div>
        <div id="telemetry" class="hidden">
          <h2>BOT TELEMETRY</h2>
          <div id="telemetry-log"></div>
        </div>
      </aside>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
